[project]
name = "delve"
version = "0.1.0"
description = "Frozen-policy discovery–execution trajectory collection"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "python-dotenv==1.2.2",
  "huggingface-hub==2.2.0",
  "math-verify==0.9.0",
  "zstandard==0.25.0",
  "numpy==2.4.3",
  "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pyright==1.1.408",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
frozen = [
  "torch==2.14.1",
  "transformers==5.20.1",
  "peft==0.21.2",
  "accelerate==1.15.0",
  "datasets==5.1.0",
  "safetensors==0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["discovery_execution/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["discovery_execution", "frozen_solver"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
